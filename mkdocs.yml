site_name: Rit Guides
site_url: https://guides.clubhouseworld.net/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/game-filters.js

plugins:
  - search

nav:
  - Home: index.md
  - Games:
      - All Games: games.md
      - Retro Rewind: retro-rewind.md
      - Mario Party: mario-party.md
      - Mario vs. Luigi: mario-vs-luigi.md
      - SM64CoopDX: sm64coopdx.md
